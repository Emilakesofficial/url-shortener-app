name: CI Build and Push

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}  

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: emilakes/url-shortener-kutt:${{ steps.vars.outputs.sha_short }}

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: emilakesofficial/url-shortener-gitops
          token: ${{ secrets.GITOPS_REPOS_TOKEN }}
          path: gitops

      - name: Update image tag in GitOps repo
        run: |
          cd gitops
          sed -i "s/tag: .*/tag: ${{ steps.vars.outputs.sha_short }}/" kutt/values-prod.yaml
          cat kutt/values-prod.yaml

      - name: Commit and push GitOps changes
        run: |
          cd gitops
          git config user.name "GitHub-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kutt/values-prod.yaml
          git commit -m "Update image tag to ${{ steps.vars.outputs.sha_short }}" || echo "No changes to commit"
          git push
           